name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The fast lane. PhoneDownKit is pure Foundation, so the entire domain —
  # scheduling, accumulation, statistics — tests natively in seconds without
  # booting a simulator.
  #
  # On failure the compiler output is posted back as a commit comment. There is
  # no local Mac and the workflow log needs an authenticated download, so
  # without this a red build is opaque from the machine doing the work. Commit
  # comments are readable through the public API.
  domain:
    name: Domain tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Test PhoneDownKit
        id: test
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '**CI failure — `swift test`**'
            echo
            echo '```'
            grep -E 'error:' /tmp/test.log | head -40 || echo '(no error: lines)'
            echo '```'
            echo '<details><summary>tail</summary>'
            echo
            echo '```'
            tail -60 /tmp/test.log
            echo '```'
            echo '</details>'
          } > /tmp/body.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" --silent
