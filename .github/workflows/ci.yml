name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast lane. PhoneDownKit is pure Foundation, so the entire domain —
  # scheduling, accumulation, statistics — tests natively in seconds without
  # booting a simulator.
  #
  # Failures are echoed into the job summary because there is no local Mac:
  # the workflow log needs an authenticated download, but the job summary comes
  # back through the public check-runs API. Without this a red build is opaque
  # from the machine actually doing the work.
  domain:
    name: Domain tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Test PhoneDownKit
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee /tmp/test.log; then
            {
              echo '### swift test failed'
              echo '```'
              grep -E 'error:|warning:|failed|Fatal' /tmp/test.log | head -60 || true
              echo '```'
              echo '<details><summary>tail</summary>'
              echo '```'
              tail -80 /tmp/test.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
