name: PhoneDown

options:
  bundleIdPrefix: com.lucabovelli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PhoneDownKit:
    path: PhoneDownKit

targets:
  PhoneDown:
    type: application
    platform: iOS
    sources:
      - path: Sources/PhoneDown
    dependencies:
      - package: PhoneDownKit
        product: PhoneDownKit
    info:
      path: Sources/PhoneDown/Info.plist
      properties:
        CFBundleDisplayName: PhoneDown
        CFBundleShortVersionString: "0.1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # audio: the keep-alive. This is the App Store disqualifier under
        # guideline 2.5.4 and it is declared deliberately — without a background
        # mode the process is suspended within thirty seconds and every lock
        # signal this build exists to observe fires into a dead app.
        #
        # location: geofence resurrection after force-quit and reboot. Region
        # monitoring itself does not need allowsBackgroundLocationUpdates, so
        # there is no persistent status-bar indicator.
        UIBackgroundModes:
          - audio
          - location

        NSLocationAlwaysAndWhenInUseUsageDescription:
          PhoneDown uses a geofence around your current location to restart itself
          if it gets shut down. It never records or transmits where you are.
        NSLocationWhenInUseUsageDescription:
          PhoneDown uses a geofence around your current location to restart itself
          if it gets shut down. It never records or transmits where you are.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucabovelli.phonedown
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
